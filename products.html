<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — The Cask & Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8; --dark: #1A1611; --gold: #B8953A; --gold-light: #D4AC52;
    --muted: #6B6355; --border: rgba(184,149,58,0.25);
    --font-display: 'Cormorant Garamond', serif; --font-body: 'Jost', sans-serif;
  }
  body { background: var(--dark); color: var(--cream); font-family: var(--font-body); font-weight: 300; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 3rem; border-bottom: 1px solid var(--border); background: rgba(26,22,17,0.95); backdrop-filter: blur(12px); }
  .nav-logo { font-family: var(--font-display); font-size: 22px; color: var(--cream); text-decoration: none; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--cream); }
  .nav-cta { background: transparent; color: var(--gold); border: 1px solid var(--border); padding: 9px 22px; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .nav-cta:hover { background: var(--gold); color: var(--dark); }

  .page-header { padding: 9rem 3rem 3rem; border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: space-between; }
  .page-header h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 300; }
  .page-header p { font-size: 13px; color: var(--muted); }

  .shop-layout { display: grid; grid-template-columns: 220px 1fr; }
  .sidebar { border-right: 1px solid var(--border); padding: 2.5rem 2rem; position: sticky; top: 70px; height: fit-content; }
  .filter-group { margin-bottom: 2.5rem; }
  .filter-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; display: block; }
  .filter-btn { display: block; width: 100%; text-align: left; background: transparent; border: none; border-left: 2px solid transparent; color: var(--muted); font-family: var(--font-body); font-size: 13px; padding: 6px 10px; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { color: var(--cream); border-left-color: var(--border); }
  .filter-btn.active { color: var(--cream); border-left-color: var(--gold); }

  .products-area { padding: 2.5rem 3rem; }
  .products-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .products-count { font-size: 13px; color: var(--muted); }
  .sort-select { background: transparent; border: 1px solid var(--border); color: var(--cream); font-family: var(--font-body); font-size: 12px; padding: 7px 12px; cursor: pointer; }
  .sort-select option { background: var(--dark); }

  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; }
  .product-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); transition: border-color 0.3s, transform 0.3s; cursor: pointer; }
  .product-card:hover { border-color: rgba(184,149,58,0.5); transform: translateY(-4px); }

  /* IMAGE - fixed height, fills neatly */
  .product-img { width: 100%; height: 220px; overflow: hidden; position: relative; border-bottom: 1px solid var(--border); background: rgba(184,149,58,0.04); }
  .product-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-badge { position: absolute; top: 0.75rem; left: 0.75rem; background: var(--gold); color: var(--dark); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; z-index: 1; }

  .product-info { padding: 1rem; }
  .product-region { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem; }
  .product-name { font-family: var(--font-display); font-size: 16px; font-weight: 400; margin-bottom: 0.3rem; }
  .product-notes { font-size: 11px; color: var(--muted); margin-bottom: 0.75rem; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; }
  .product-price { font-family: var(--font-display); font-size: 18px; }
  .add-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
  .add-btn:hover { border-color: var(--gold); color: var(--gold); }
  .add-btn.added { border-color: var(--gold); color: var(--gold); }

  .toast { position: fixed; bottom: 2rem; right: 2rem; z-index: 500; background: var(--gold); color: var(--dark); padding: 12px 24px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  footer { border-top: 1px solid var(--border); padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; }

  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .page-header { padding: 7rem 1.5rem 2rem; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    .shop-layout { grid-template-columns: 1fr; }
    .sidebar { position: static; border-right: none; border-bottom: 1px solid var(--border); padding: 1.5rem; }
    .products-area { padding: 1.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">The Cask & Co.</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html" class="active">Shop</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <a href="contact.html" class="nav-cta">Custom order</a>
</nav>

<div class="page-header">
  <h1>Our collection</h1>
  <p id="product-count">Showing 9 products</p>
</div>

<div class="shop-layout">
  <aside class="sidebar">
    <div class="filter-group">
      <span class="filter-label">Category</span>
      <button class="filter-btn active" onclick="filterProducts('all', this)">All products</button>
      <button class="filter-btn" onclick="filterProducts('wine', this)">🍷 Wine</button>
      <button class="filter-btn" onclick="filterProducts('spirits', this)">🥃 Spirits</button>
      <button class="filter-btn" onclick="filterProducts('beer', this)">🍺 Craft beer</button>
      <button class="filter-btn" onclick="filterProducts('gifts', this)">🎁 Gift sets</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">Origin</span>
      <button class="filter-btn active" onclick="filterOrigin('all', this)">All regions</button>
      <button class="filter-btn" onclick="filterOrigin('france', this)">France</button>
      <button class="filter-btn" onclick="filterOrigin('japan', this)">Japan</button>
      <button class="filter-btn" onclick="filterOrigin('scotland', this)">Scotland</button>
      <button class="filter-btn" onclick="filterOrigin('singapore', this)">Singapore</button>
      <button class="filter-btn" onclick="filterOrigin('china', this)">China</button>
      <button class="filter-btn" onclick="filterOrigin('thailand', this)">Thailand</button>
    </div>
  </aside>

  <div class="products-area">
    <div class="products-toolbar">
      <span class="products-count" id="grid-count">9 products</span>
      <select class="sort-select" onchange="sortProducts(this.value)">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </div>
</div>

<div class="toast" id="toast">Added to cart ✓</div>

<footer>
  <span>© 2026 The Cask & Co.</span>
  <span>Must be 18+ · <a href="#">Delivery info</a></span>
</footer>

<script>
// =============================================
// UPDATE the image filenames below to match
// your actual files in css/images/ folder
// =============================================
const allProducts = [
  { id:1, cat:'wine',    image:'redwine1.jpg',         region:'Wine · Bordeaux, France',   origin:'france',    name:'Château Margaux Reserve',     notes:'Dark fruit · cedar · silky tannins',       price:89,  badge:'Staff pick' },
  { id:2, cat:'wine',    image:'cloudybay.webp',       region:'Wine · Bordeaux, France',   origin:'france',    name:'Cloudy Bay Sauvignon Blanc',   notes:'Citrus · green apple · fresh herbs',      price:99,  badge:'Staff pick' },
  { id:3, cat:'wine',    image:'champagne2.jpeg',      region:'Champagne · France',        origin:'france',    name:'Billecart-Salmon Brut',      notes:'Fine bubbles · brioche · crisp acidity',    price:95,  badge:null },
  { id:4, cat:'wine',    image:'domainleflaive1.jpeg', region:'Wine · Burgundy, France',   origin:'france',    name:'Domaine Leflaive Puligny',   notes:'Mineral · citrus · elegant finish',         price:145, badge:null },
  { id:5, cat:'spirits', image:'whisky1.jpeg',         region:'Whisky · Japan',            origin:'japan',     name:'Nikka From the Barrel',      notes:'Honeyed oak · dried fruit · spice',         price:72,  badge:'Best seller' },
  { id:6, cat:'spirits', image:'Hendricks1.jpeg',      region:'Gin · Scotland',            origin:'scotland',  name:"Hendrick's Midsummer",       notes:'Rose · cucumber · elderflower',             price:58,  badge:null },
  { id:7, cat:'spirits', image:'monkey47.jpeg',       region:'Gin · Germany',              origin:'Germany',   name:"The Botanist, Monkey 47",    notes:'Strong juniper (classic gin taste)',         price:149,  badge:null },
  { id:8, cat:'spirits', image:'hennessy.avif',        region:'Whisky · France',           origin:'france',    name:'Hennessy VSOP',              notes:'Vanilla · oak · spice',                     price:85,  badge:null },
  { id:9, cat:'gifts',   image:'spiritsbox1.jpg',      region:'Gift set',                  origin:'all',       name:'Spirits Discovery Box',      notes:'4 × 200ml curated miniatures',              price:68,  badge:'Gift idea' },
  { id:10, cat:'spirits', image:'mountgay.jpeg',       region:'Rum · Barbados',            origin:'all',       name:'Mount Gay XO',               notes:'Vanilla · dried apricot · toasted oak',       price:64,  badge:null },
  { id:11, cat:'spirits', image:'rum.jpg',             region:'Rum · Barbados',            origin:'france',    name:'Boatrocker',                 notes:'flavors like vanilla, oak, and caramel',    price:105,  badge:null },
  { id:12, cat:'spirits', image:'vodka.jpeg',          region:'Vodka · Barbados',          origin:'france',    name:'Absolut Vodka',              notes:'Smooth, slightly sweet',                    price:50,  badge:null },
  { id:13, cat:'spirits', image:'macallan.jpeg',       region:'whisky · Scotland',         origin:'Scotland',  name:'Macallan Sherry Oak 18',     notes:'Rich dried fruit · chocolate · spice',      price:640,  badge:null },
  { id:14, cat:'spirits', image:'donjulio.jpg',       region:'Margaritas & cocktails',     origin:'Mexico',    name:'Don Julio Blanco',           notes:'Crisp agave · citrus · light body · 38-40%',         price:89,  badge:null },
  { id:15, cat:'spirits', image:'moutai.jpeg',         region:'baijiu · China',            origin:'China',     name:'Moutai',                     notes:'complex and savory',                        price:699,  badge:null },
  { id:16, cat:'spirits', image:'wuliangye.jpeg',      region:'baijiu · China',            origin:'China',     name:'Wuliangye',                  notes:' pineapple and licorice 53%',                  price:309,  badge:null },
  { id:17, cat:'beer',   image:'brewdog2.jpeg',        region:'Stout · Scotland',          origin:'scotland',  name:'BrewDog Milk Stout',         notes:'Chocolate · coffee · smooth body',          price:9,   badge:null },
  { id:18, cat:'beer',   image:'corona.jpeg',          region:'Mexico',                    origin:'Mexico',    name:'Corona Extra',               notes:'Crisp · refreshing · light body',           price:9,   badge:null },
  { id:19, cat:'beer',    image:'hazy1.jpeg',          region:'IPA · Singapore',           origin:'singapore', name:'Little Island Hazy IPA',     notes:'Tropical · citrus · hazy finish',           price:12,  badge:'Local fave' },
  { id:20, cat:'beer',    image:'singha.jpeg',         region:'Thailand',                  origin:'Thailand',  name:'Singha Lager',               notes:'Crisp · malty · refreshing',                price:9,  badge:'Local fave' },
];

let filtered = [...allProducts];
let activeCat = 'all';
let activeOrigin = 'all';

function filterProducts(cat, btn) {
  document.querySelectorAll('.filter-group:first-child .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = cat;
  applyFilters();
}

function filterOrigin(origin, btn) {
  document.querySelectorAll('.filter-group:last-child .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeOrigin = origin;
  applyFilters();
}

function applyFilters() {
  filtered = allProducts.filter(p => {
    const catOk = activeCat === 'all' || p.cat === activeCat;
    const originOk = activeOrigin === 'all' || p.origin === activeOrigin;
    return catOk && originOk;
  });
  renderGrid();
}

function sortProducts(val) {
  if (val === 'price-asc') filtered.sort((a,b) => a.price - b.price);
  else if (val === 'price-desc') filtered.sort((a,b) => b.price - a.price);
  else if (val === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('products-grid');
  document.getElementById('grid-count').textContent = filtered.length + ' product' + (filtered.length !== 1 ? 's' : '');
  document.getElementById('product-count').textContent = 'Showing ' + filtered.length + ' products';
  grid.innerHTML = filtered.map(p => `
    <div class="product-card">
      <div class="product-img">
        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
        <img src="images/${p.image}" alt="${p.name}" />
      </div>
      <div class="product-info">
        <div class="product-region">${p.region}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-notes">${p.notes}</div>
        <div class="product-footer">
          <div class="product-price">S$${p.price}</div>
          <button class="add-btn" id="add-${p.id}" onclick="addToCart(${p.id}, this)">+ Add</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id, btn) {
  btn.textContent = '✓ Added';
  btn.classList.add('added');
  showToast();
  setTimeout(() => { btn.textContent = '+ Add'; btn.classList.remove('added'); }, 2000);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderGrid();

const params = new URLSearchParams(window.location.search);
if (params.get('cat')) {
  const catBtn = [...document.querySelectorAll('.filter-btn')].find(b => b.textContent.toLowerCase().includes(params.get('cat')));
  if (catBtn) catBtn.click();
}
</script>
</body>
</html>
